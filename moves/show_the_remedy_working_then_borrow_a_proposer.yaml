id: show_the_remedy_working_then_borrow_a_proposer
description: >-
  Spells out how the arrangement just named would do the missing work, then
  names a figure of standing who proposed the same thing, so the idea reads as
  serious rather than invented.
breaks:
  - >-
    cut the outside attribution — the arrangement reads as the writer's own
    invention and carries no weight beyond their say-so
  - >-
    assert only that the arrangement would work, without naming what it would
    establish and what would act on breaches — the reader cannot see it
    supplying the capacity shown to be missing
  - >-
    expand the attribution into an account of the figure and their reasoning —
    the borrowed weight thins out and the argument stalls just before its turn
  - >-
    put the attribution ahead of the working-out — the reader meets a name with
    nothing yet for it to attach to
  - >-
    state the arrangement as settled fact rather than as a conditional — the
    reader stops reading it as a proposal and starts doubting the writer's grip
    on things
segments:
  - operation: >-
      sets out, as a conditional, what an arrangement would be able to do once
      in place, naming what it would establish and what would act on breaches
  - operation: >-
      attributes the position to a recognized figure from an earlier time
    relation: >-
      backs the step just made by showing the position was advanced in earnest
      by someone other than the writer
    manner: a single bare attribution, offered with no elaboration
takes:
  - kind: explain
    what: an arrangement named but not yet shown in its working
leaves:
  - kind: apply
    what: a conditional general claim about an arrangement, awaiting a case
    segment: 1
  - kind: explain
    what: an earlier authority invoked but not yet accounted for
    segment: 2
