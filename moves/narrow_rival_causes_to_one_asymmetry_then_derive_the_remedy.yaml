id: narrow_rival_causes_to_one_asymmetry_then_derive_the_remedy
description: >-
  Opens on many possible causes, narrows to one structural asymmetry shown side
  by side, then derives a single radical remedy and grounds it on the absence of
  any alternative.
before:
  knowledge: no specialized grasp of the subject beyond everyday impressions
  question: >-
    no settled question, at most a vague wondering why the condition persists
  expectation: expects general commentary with no particular shape
  orientation: places the text among ordinary commentary on the subject
  trust: neutral, neither sceptical nor committed
after:
  knowledge: >-
    holds one stated structural cause for the condition and one remedy derived
    from it
  question: >-
    wants to know whether the proposed arrangement could ever be brought about
  expectation: >-
    expects the objections to the proposal to be taken up next, the derivation
    itself being finished
  orientation: >-
    places the text as pressing one unusual remedy rather than surveying
    opinions
  trust: >-
    raised, rival explanations and an awkward counter-fact having been granted
    before the case was pressed
breaks:
  - >-
    Drop the opening list of rival explanations — the single cause arrives as
    the only one ever considered, and the reader discounts it as a hobby-horse
  - >-
    Give the familiar sphere without the unfamiliar one — the asymmetry the
    whole case rests on never becomes visible, and the remedy looks arbitrary
  - >-
    Cut the dated case from the second sphere — the asymmetry stays a bare
    assertion the reader cannot check from experience
  - >-
    Leave out the concession that a formal rule already exists — the alert
    reader supplies that objection unaided and stops following
  - >-
    Add two paragraphs weighing the remedy's difficulties before it is stated
    plainly — the proposal is hedged before the reader has grasped it, and the
    force of the derivation is spent
  - >-
    Close on the mechanism and omit the final ranking of stakes — the reader
    takes the proposal as one option among many rather than as one urged for
    want of an alternative
segments:
  - operation: >-
      lists several conceivable explanations for a persistent condition without
      settling on any of them
  - operation: >-
      names one decisive factor and locates it in a difference between two
      spheres of the same kind
    relation: >-
      sets aside the open list just offered and narrows to a single line of
      explanation
  - operation: >-
      describes the first sphere by the arrangement that holds within it
    relation: >-
      fills in the first half of the contrast the previous step announced
  - operation: >-
      describes the second sphere as lacking the arrangement that holds in the
      first
    relation: >-
      mirrors the previous step point for point on the other side of the same
      contrast
    manner: >-
      the lack is carried by one dated case rather than by further description
  - operation: >-
      concedes that a formal rule already exists, withdraws its force by noting
      that nothing enforces it, and draws out how that is exploited
    relation: forestalls the objection the completed contrast invites
  - operation: >-
      proposes the remedy as supplying at the largest scale the arrangement
      found missing
    relation: >-
      turns from diagnosis to remedy, the remedy being the mirror of the lack
      just established
  - operation: >-
      sets out the working parts of the proposed arrangement and attaches an
      earlier advocate of the same proposal
    relation: fills in the mechanism of the remedy named in the step before
  - operation: >-
      grounds the proposal on the absence of any alternative and ranks its stake
      above every competing aim
    relation: >-
      stops adding to the remedy and states instead the ground on which it is
      urged
