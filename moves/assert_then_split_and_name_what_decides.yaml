id: assert_then_split_and_name_what_decides
description: >-
  Asserts a blanket tendency, then splits it into cases where it holds and cases
  where it does not, and closes by naming the small set of determinants that
  decide which.
before:
  knowledge: nothing of the subject beyond everyday impressions
  question: none formed beyond whether the explanation will be followable
  expectation: expects a plain introductory explanation pitched at a beginner
  trust: neutral, with no reason yet to credit or doubt
after:
  knowledge: >-
    holds a general tendency, knows it holds only in some circumstances, and
    knows a counted number of named determinants decide which
  question: wants to know how each named determinant works
  expectation: >-
    expects the named determinants to be taken up one by one, the naming itself
    now finished
  trust: >-
    raised a little, since a sweeping claim is qualified by the speaker rather
    than left standing
breaks:
  - >-
    Drop the qualifying division and let the opening generalisation stand — the
    reader is left with no gap to be curious about, and the named determinants
    arrive as decoration
  - >-
    Name the determinants before the generalisation is withdrawn — the reader
    has nothing for them to decide and reads them as a list to memorise
  - >-
    Explain each determinant here instead of only naming it — the one turn the
    paragraph makes is buried, and the reader loses the sense that a short step
    has been completed
  - >-
    Add a hedge to the opening generalisation — the withdrawal that follows
    lands on a claim already weakened, and the reversal costs nothing
segments:
  - operation: >-
      ascribes an overriding motive to a class of actors and derives a universal
      reaction from it
  - operation: >-
      divides a general tendency into the circumstances where it holds and those
      where it does not, so that one and the same occurrence meets opposite
      receptions
    relation: >-
      it withdraws the universality the step before it claimed, keeping the
      tendency but confining it to some circumstances
  - operation: >-
      reduces unevenness in a tendency to a counted number of named determinants
    relation: >-
      it answers the question the preceding division leaves open, naming what
      decides which side a case falls on
    manner: the determinants are given as bare names that take no elaboration
obligation:
  - each of the counted determinants, in the order named
