id: rule_out_the_parties_and_isolate_the_one_condition
description: >-
  Closes a worked pair by stating its combined result, ruling out a difference
  in the parties compared, and leaving one varying condition as the whole
  explanation.
before:
  knowledge: >-
    now holds both categories filled by an everyday instance, each carried
    through to its own opposed practical consequence
  question: >-
    the contrasting instance is settled, and now whether the two filled cases
    carry back to the larger subject the term was defined for
  expectation: >-
    that the matched pair, both halves now worked through, is applied back to
    the subject the term was introduced for
  trust: >-
    raised further: a comparison is openly held to what it will bear instead of
    being pressed beyond it
after:
  knowledge: >-
    now holds the paired outcome as turning on one varying external condition
    rather than on any difference in the actors
  question: >-
    what made the difference inside the pair is settled, and now whether the
    stated principle reaches the larger subject the term was defined for
  expectation: >-
    that the principle just stated, rather than the worked instances, is what
    gets carried to the subject the term was introduced for
  trust: >-
    raised further: a flattering explanation by the nature of the parties
    compared is refused rather than used
breaks:
  - >-
    drop the sentence denying a difference in the parties — the paired outcome
    reads as a claim about the nature of the parties, and the principle no
    longer travels
  - >-
    state only the closing conclusion and cut the paired outcome — the reader
    has nothing the conclusion is drawn from, and the two cases stay separate in
    their heads
  - >-
    add a paragraph of supporting statistics behind the paired outcome — the
    plain generalisation becomes an argued claim, and the reader stops to weigh
    evidence instead of carrying the principle onward
  - >-
    soften the closing sentence to say the condition may matter — the single
    variable stops being decisive, and the refused explanation comes back as a
    live alternative
segments:
  - operation: >-
      states the two worked cases as a single paired statement of outcome
  - operation: >-
      rules out a difference in the parties themselves as the explanation
    relation: >-
      removes the explanation a reader is most likely to reach for once the
      paired outcome is in front of them
  - operation: >-
      isolates the single varying condition as what determines the rational
      course
    relation: >-
      supplies the one explanation left standing after the previous one was
      taken away
