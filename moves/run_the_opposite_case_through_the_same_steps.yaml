id: run_the_opposite_case_through_the_same_steps
description: >-
  Fills the other half of a two-way distinction by running a second everyday
  case through the same steps as the first, ending on the opposite practical
  consequence.
before:
  knowledge: >-
    now also holds the practical consequence that the assignment entails, and a
    familiar motive restated in the framework's terms
  question: >-
    still the contrasting instance, and now also whether a consequence of the
    same shape can be drawn there
  expectation: >-
    that the contrasting instance comes next, one case having now been carried
    from its assignment to a consequence about motive
  trust: >-
    raised further: difficulty is acknowledged openly and a classification is
    given with its ground rather than asserted
after:
  knowledge: >-
    now holds both categories filled by an everyday instance, each carried
    through to its own opposed practical consequence
  question: >-
    the contrasting instance is settled, and now whether the two filled cases
    carry back to the larger subject the term was defined for
  expectation: >-
    that the matched pair, both halves now worked through, is applied back to
    the subject the term was introduced for
  trust: >-
    raised further: a comparison is openly held to what it will bear instead of
    being pressed beyond it
breaks:
  - >-
    cut the aside that limits the comparison — the claim reads as an absolute
    promise of safety and the reader starts arguing with it instead of following
    it
  - >-
    drop the sentence naming the effective means of attack — the classification
    arrives with no ground, and the reader has only the author's word for it
  - >-
    state the closing practical consequence first and the ground after — the
    small conclusion lands as a dismissal before the reader has anything to
    weigh it against
  - >-
    leave out the voiced thought that is ruled out — the contrast with the
    motive drawn in the earlier case never closes, and the reader has to
    construct it alone
  - >-
    add a paragraph of statistics for both instances — the comparison stops
    being checkable from the reader's own life, and the repeated step order that
    made it easy to follow is buried
segments:
  - operation: introduces an instance defined by the absence of a given feature
  - operation: assigns the instance to one of the two available categories
    relation: >-
      states the classification of the instance the step before has just put on
      the table
  - operation: names the means that counts as effective within the instance
    relation: >-
      narrows from the classification to the particular means the instance
      leaves available, beginning its justification
  - operation: >-
      concedes the hard case and shows that room still remains, then bounds how
      far the point is to be taken
    relation: >-
      supplies the ground for the classification by working through the means
      the step before named
    manner: >-
      a brief aside holding the claim to no more than the comparison supports
  - operation: >-
      generalizes from the worked instance to a standing rule and names what
      follows from it
    relation: >-
      draws the general rule out of the concession and the ground just given
  - operation: >-
      states that one particular line of reasoning does not arise under the rule
    relation: >-
      narrows the general rule just stated to the single line of reasoning it
      excludes
    manner: >-
      the excluded reasoning is voiced in the first person as a passing thought
      rather than described
  - operation: >-
      draws the practical consequence that follows for the instance under the
      rule
    relation: >-
      turns the reasoning just excluded into the modest practical step that is
      left over
