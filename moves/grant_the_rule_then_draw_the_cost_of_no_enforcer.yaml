id: grant_the_rule_then_draw_the_cost_of_no_enforcer
description: >-
  Grants that a prohibition exists, names the absence of anything able to apply
  it to all alike, and derives from that gap the very conduct the prohibition
  forbids.
before:
  knowledge: >-
    holds both sides, the second one lacking that mechanism and shown lacking it
    in a past case
  question: wants to know what follows where the mechanism is absent
  expectation: >-
    expects the next step to draw out the consequence of the asymmetry now set
    out
  trust: >-
    raised further: a sweeping negative claim is backed by a dated case the
    reader can check
after:
  knowledge: >-
    holds that a formal rule can exist with nothing able to apply it, and that
    the gap invites the conduct the rule forbids
  question: >-
    has that consequence and now wants to know whether such a gap can be closed
    at all
  expectation: >-
    expects the next step to move from the consequence just drawn to whether
    anything could close the gap
  trust: >-
    raised again: the objection the reader could have made is granted before the
    claim is pressed
breaks:
  - >-
    drop the concession that a prohibition exists — the reader raises that
    objection themselves and the claim reads as careless
  - >-
    name the absence and stop there — the asymmetry stays an observation and
    never becomes a cause
  - >-
    report the acting parties' reasoning in the writer's own words instead of
    voicing it — the calculation reads as the writer's speculation rather than
    theirs
  - >-
    add a survey of the bodies that partly do apply such rules — the single
    clean absence becomes a matter of degree and the consequence no longer
    follows
segments:
  - operation: concedes that a formal prohibition is already in place
  - operation: >-
      names the absence of any body able to apply a prohibition to all parties
      alike
    relation: >-
      turns the admission just made against itself by naming what it lacks
  - operation: >-
      derives from an absence the conduct it leaves open, as a calculation some
      parties make and act on
    relation: >-
      takes the concession and the absence together as one premise and states
      what follows from them
    manner: >-
      the calculation is voiced as the acting parties' own words rather than
      reported
