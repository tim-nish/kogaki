id: name_the_extreme_case_then_raise_it_to_a_rule
description: >-
  Names the condition a worked case illustrated, then raises avoiding it into a
  rule said to hold everywhere and always.
breaks:
  - >-
    drop the single name and keep the long description — the reader carries a
    phrase instead of a handle that later steps can lean on
  - >-
    assert the principle without the claim of age and reach — the rule reads as
    this author's own preference rather than a settled one
  - >-
    add further examples after the principle — the one clean statement is
    diluted and the reader loses the sense that it needs no defending
segments:
  - operation: >-
      fixes a single name for an extreme case and names the property that
      defines it
  - operation: >-
      raises a single requirement into a principle presented as holding across
      all times and places
    relation: >-
      lifts what the step before it only labelled into a standing rule about
      that label
takes: []
leaves:
  - kind: apply
    what: a general rule stated broadly, left to be shown in a case
    segment: 2
