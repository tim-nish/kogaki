id: name_a_self_reinforcing_spiral_then_size_its_cost
description: >-
  Adds one more consequence of the same condition, names the self-feeding state
  it produces, then unfolds that name into the reasoning behind it and the two
  ways the cost grows.
before:
  knowledge: >-
    also holds a second and wider consequence of the same condition, together
    with the incentive that drives it and the end point it reaches
  question: >-
    wants to know whether the end point just reached can be escaped at all
  expectation: >-
    expects a further consequence of the same condition, now that a second one
    has been carried to its end point
after:
  knowledge: >-
    also holds a third consequence of the same condition, a name for the
    self-feeding state it settles into, and the two ways that state worsens the
    outcome
  question: >-
    wants to know whether a process that feeds on itself can be stopped once it
    starts
  expectation: >-
    expects a turn from listing consequences to whether any of them can be
    undone, now that a third has been named and run out to its effects
breaks:
  - >-
    move the naming sentence ahead of the behaviour it covers — the reader meets
    a label with nothing behind it and has to hold it empty until the third step
  - >-
    cut the quoted reasoning and report it in the author's own voice — the
    reader loses the sense of a party thinking from inside its own fear, and the
    escalation reads as an assertion
  - >-
    stop at the rising likelihood and leave out the growth in scale — the reader
    takes the state as more of the same risk rather than a worse kind of it
  - >-
    add a paragraph of examples after the naming sentence — the chain from
    behaviour to name to consequence is interrupted and the running list loses
    its thread
segments:
  - operation: >-
      traces how uncertainty about what is concealed drives parties to
      accumulate beyond need
  - operation: gives the state just described a name
    relation: attaches a label to the behaviour the previous step traced
    manner: a single short statement offered without elaboration
  - operation: >-
      unfolds the named state into the reasoning each party follows and the two
      ways the result worsens
    relation: >-
      expands the label just given into how it works and what it leads to
    manner: >-
      gives the reasoning in a quoted first-person voice rather than describing
      it from outside
