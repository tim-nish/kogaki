id: voice_the_readers_question_then_answer_and_widen_the_cause
description: >-
  Turns the anomaly just granted into the reader's own question, answers it at
  once with one named cause, then widens that cause into a recurring historical
  pattern.
breaks:
  - >-
    leave the question unvoiced and open on the cause — the reader is handed an
    answer to something they never heard asked, and the cause reads as bare
    assertion
  - >-
    elaborate the answer across several sentences before generalising — the
    directness that makes the answer feel settled is gone and the reader waits
    for a point already available
  - >-
    cut the closing generalisation — the cause stays tied to the present moment
    and the demand still reads as a passing fashion
  - >-
    put the generalisation ahead of the direct answer — the reader meets a long
    pattern with nothing yet to attach it to
  - >-
    hedge the cause with several contributing factors — nothing is given to
    carry forward, and the question the paragraph voiced stays open
segments:
  - operation: puts the question at issue as a direct question
  - operation: names the foremost cause as the answer
    relation: >-
      settles the question just put, taking it up immediately rather than
      approaching it
    manner: a short declarative that takes no elaboration
  - operation: >-
      denies a recent origin and generalises the cause into a pattern that has
      recurred over past time
    relation: >-
      widens the answer just given from the present case into a repeated one, so
      the cause holds beyond the moment
takes: []
leaves:
  - kind: apply
    what: a cause generalised into a recurring pattern, awaiting work on cases
    segment: 3
