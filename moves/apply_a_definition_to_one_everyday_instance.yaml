id: apply_a_definition_to_one_everyday_instance
description: >-
  Admits a definition is hard to use, then runs one everyday instance through
  it: plain fact, label, and the matched reason, so the reader can apply the
  distinction themselves.
before:
  knowledge: holds one named measure and the two cases it divides into
  question: what decides which of the two cases holds, and what follows from it
  expectation: >-
    that what follows will put the two cases to work rather than define further
  trust: >-
    raised: the writer settles a term's meaning before building anything on it
after:
  knowledge: >-
    also holds one worked instance assigned to one of the cases together with
    the ground for the assignment
  question: >-
    answered for one instance; now what the contrasting instance of the
    announced pair yields
  expectation: >-
    that the other instance of the announced pair will be worked through the
    same way
  trust: >-
    raised further: difficulty is acknowledged openly and a classification is
    given with its ground rather than asserted
breaks:
  - >-
    Drop the opening admission that the material is a little complex — the move
    to an everyday example reads as a change of subject rather than a promised
    simplification, and the reader stops expecting the definitions to come back.
  - >-
    Name only the one country in the opening instead of the pair — the reader
    has no counterpart to wait for, and the contrast the following step needs
    arrives unprepared.
  - >-
    State the label and stop, leaving out the clause that gives the reason — the
    reader is handed a verdict they cannot check, and the measure stays
    something only the writer can apply.
  - >-
    Give the reason as a single clause about the attacking side alone — the
    symmetry of the two defined cases is no longer visible in the worked
    instance, and the reader cannot see what the paired instance will reverse.
  - >-
    Add figures, rules and statistics to the plain fact — the example stops
    being something the reader already knows, and the simplification costs more
    attention than the definitions it was meant to relieve.
segments:
  - operation: >-
      announces that the material will be simplified and names the pair of
      contrasting instances the simplification will run on
    manner: >-
      the ground for simplifying is one bare adjective stated in passing and
      never unfolded, and the turn to the example is cast as a
      first-person-plural invitation
  - operation: >-
      states one commonly known fact about the first of the paired instances
    relation: >-
      supplies the first instance the previous step promised to work through
  - operation: >-
      assigns the instance just described to one of a set of already defined
      categories
    relation: >-
      applies to the fact just stated the classification the paragraph's
      framework makes available
  - operation: >-
      states the ground on which such a classification holds, covering each side
      of the asymmetry
    relation: >-
      answers the why that the classification just made invites, tied to it by
      an explicit causal connective
    manner: two balanced clauses mirroring each other, one per side
