id: close_on_the_only_ground_and_rank_its_aim_above_all
description: >-
  Closes by naming the one ground for a proposal, that nothing else serves the
  same end, and then setting that end above every other aim, in a voice speaking
  for itself.
before:
  knowledge: >-
    also holds how that arrangement would work in practice and that it has been
    proposed in earnest before
  question: >-
    has an answer in principle and now wants to know whether that arrangement
    could ever be brought about
  expectation: >-
    expects to learn what became of the earlier proposal, and so whether the
    arrangement is attainable
  trust: >-
    raised further: the idea is shown to have been advanced in earnest by a
    figure of standing
after:
  knowledge: >-
    also holds the stated ground for the proposal and the ranking of one aim
    above every other
  question: >-
    still wants to know whether it can be brought about, and now also weighs
    whether one aim can outrank all others
  expectation: >-
    expects no further argument, the case having come to rest on a single
    overriding aim
  trust: >-
    raised further still: the case is heard from a committed voice speaking for
    itself rather than reported at second hand
breaks:
  - >-
    report the ground at second hand instead of letting the voice speak — the
    close reads as the writer's own summing-up and loses the weight of a
    committed speaker
  - >-
    add a clause conceding that other means might serve the same end — the
    ground named as the only one collapses and the ranking that follows has
    nothing to stand on
  - >-
    put the ranking first and the ground after it — the ordering claim arrives
    before the reader knows what it is being ordered against
  - >-
    expand the closing claim into a paragraph of defence — the flat priority
    statement loses its finality and the close trails off
segments:
  - operation: >-
      names the single ground for a stance by ruling out any other means to the
      end in view
    manner: spoken in a first-person voice that is not the narrator's
  - operation: sets one aim above every other as a fixed order of priority
    relation: >-
      raises the end that the ground in the step before was measured against
      into the aim that outranks all others
