id: flip_the_condition_and_make_it_checkable_by_counting
description: >-
  States the reverse of an established condition, backs it with one capability
  reason and one from the other side's own reckoning, then makes both concrete
  in a counted case.
before:
  knowledge: >-
    also holds a third consequence of the same condition, a name for the
    self-feeding state it settles into, and the two ways that state worsens the
    outcome
  question: >-
    wants to know whether a process that feeds on itself can be stopped once it
    starts
  expectation: >-
    expects a turn from listing consequences to whether any of them can be
    undone, now that a third has been named and run out to its effects
  trust: >-
    raised further, since a term is explained as soon as it is used rather than
    left to stand
after:
  knowledge: >-
    also holds the mirror setting of that condition and its opposite outcome,
    with two separate reasons why it holds
  question: >-
    wants to know whether the favourable setting of the condition can be brought
    about deliberately
  expectation: >-
    expects the next step to say how the favourable setting is obtained, now
    that the reverse case has been stated and backed
  trust: >-
    raised further still, since a general claim is made checkable by a counted
    case rather than left as assertion
breaks:
  - >-
    Drop the second reason, the other side's own judgment — the condition reads
    as mere shoring-up of one's own position, and the reader never sees why
    anyone would stop trying.
  - >-
    Cut the counted example — the claim stays abstract and the reader has no way
    to test the balance for themselves.
  - >-
    Make the example's two quantities uneven — the reader reads the matching as
    a coincidence rather than the point, and the reasoning stops being checkable
    by counting.
  - >-
    Put the two reasons before the headline claim — the reader collects
    mechanisms with nothing to attach them to, and the contrast with the earlier
    condition is lost.
  - >-
    Keep the example but drop its closing clause, where the other side
    understands the balance — only one of the two reasons is illustrated, and
    the second is left as assertion.
  - >-
    Add a paragraph of qualifications about how firmly the condition must hold —
    the relief the first sentence gives is spent before the reasons arrive, and
    the reader is back in the accumulating case.
segments:
  - operation: >-
      states in one sentence that a condition makes a certain outcome unlikely
  - operation: grounds a general claim in one direct mechanism
    relation: supplies the reason for the assertion made in the step before it
  - operation: >-
      adds a second reason by moving to the reckoning of the other party
      involved
    relation: >-
      stands beside the first reason rather than following from it, adding a
      second ground for the same claim
    manner: >-
      puts the other party's reckoning in its own voice as one short quoted line
  - operation: works the stated reasons through a single concrete case
    relation: >-
      makes concrete, in one case, the two reasons stated separately before it
    manner: >-
      names matched round quantities on both sides so the balance can be checked
      by counting
