id: set_a_second_instance_beside_the_first
description: >-
  Sets a second, equally common instance beside the first, then states in one
  sentence the arrangement it depicts, turning one case into a pattern.
before:
  knowledge: >-
    holds one worked instance of how that body of knowledge bears on
    circumstances
  question: wants to know whether a single such instance stands for the whole
  expectation: >-
    expects further instances of the same kind or a return to the general claim
after:
  knowledge: >-
    holds a second instance of the same kind and the structure it depicts
  question: wants to know what these recurring instances do and fail to do
  expectation: >-
    expects what the instances so far have in common to be turned to account
breaks:
  - >-
    Drop the phrase marking the new case as equally common — the reader cannot
    tell whether the pattern is widening or the subject has changed
  - >-
    Expand the structural description into several sentences of qualification —
    the parallel with the earlier case is buried and the accumulation stalls
  - >-
    Give the structure before naming the case it belongs to — the reader holds
    an arrangement with nothing to attach it to
  - >-
    Add a worked application of the structure to present circumstances — the
    case stops being one item in a set and takes over the paragraph
segments:
  - operation: >-
      introduces a further case of the same kind as one already given, marking
      it as equally common
  - operation: >-
      states in a single sentence the arrangement the newly named case sets out
    relation: supplies the content of the case the previous step only named
