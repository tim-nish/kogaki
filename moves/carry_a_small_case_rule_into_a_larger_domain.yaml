id: carry_a_small_case_rule_into_a_larger_domain
description: >-
  Carries a rule from a small familiar case up to a much larger domain, backs it
  with the one reason the parties would act on, then shows it as already-current
  sayings.
before:
  knowledge: >-
    no specialized knowledge of the subject, and no stated rule connecting a
    balance of conditions to an outcome at the larger scale
  question: >-
    nothing in particular beyond whether an unfamiliar subject will be
    followable
  expectation: >-
    expects a plain explanation pitched for someone with no background
  trust: >-
    neutral, willing to follow a plain explanation as far as it is made clear
after:
  knowledge: >-
    holds one transferred rule together with the reason that makes it hold
  question: >-
    wants to know what follows when the balance of conditions runs the other way
  expectation: expects the opposite case to be taken up next in the same shape
  trust: >-
    raised a little, since the stated rule came with a reason rather than bare
breaks:
  - >-
    Cut the reason and leave the claim beside the sayings — the reader is handed
    an assertion and two slogans with no way to see why the condition produces
    the outcome.
  - >-
    Put the sayings before the reason — the ready-made phrases arrive as
    decoration, because the reader cannot yet hear what they encode.
  - >-
    Expand the reason into a paragraph of specialist mechanism — specialist
    vocabulary arrives before the plain rule has settled, and the carried-over
    comparison stops doing any work.
  - >-
    Drop the opening comparison and state the rule on its own — the reader loses
    the small case that made a large claim feel already granted.
  - >-
    Replace the two sayings with a single abstract summary of them — the rule
    stops sounding like something already said by others and goes back to being
    the author's own assertion.
segments:
  - operation: >-
      asserts that a rule holding in a smaller, familiar domain holds likewise
      in a much larger one
  - operation: >-
      supplies the reason the asserted rule holds, deriving it from what each
      party would find more effective
    relation: >-
      it grounds the claim the step before stated, saying why that claim holds
    manner: >-
      the reasoning is voiced as a short quoted line in the parties' own words
      rather than reported flatly
  - operation: >-
      names the stock sayings that are prized where the rule holds, presenting
      it as already-settled currency
    relation: >-
      it turns the reasoning just given into the form it already takes as common
      speech, moving from why the rule holds to how it is habitually put
    manner: >-
      two fixed phrases set side by side in place of any further explanation
