id: rehearse_an_ordering_on_an_everyday_case
description: >-
  Runs a just-defined ordering on one case from the reader's own experience:
  each part is assigned its place, then the places are shown to depend on one
  another.
breaks:
  - >-
    replace the ordinary case with one drawn from the work's own material — the
    ordering is tried on nothing the reader can check unaided, and the rehearsal
    stops being a rehearsal
  - >-
    stop after the flat assignment — the reader sees labels attached to parts
    but never that the places depend on one another
  - >-
    add a paragraph defending the choice of case before working it — the
    rehearsal swells past the point where the reader still wants the material
    itself
  - >-
    name the places without saying which part of the case fills each — the
    reader is left to guess the mapping and takes nothing checkable from it
segments:
  - operation: announces one ordinary case as the instance to be worked through.
    manner: >-
      cast as an invitation to think it through together rather than a flat
      statement.
  - operation: >-
      assigns each part of the case its place in the ordering in a single pass.
    relation: fills the case just named by giving each of its parts a place.
  - operation: >-
      restates the assignment as a sequence of requirements descending from the
      highest place to the lowest.
    relation: >-
      takes the same assignment and runs it in the opposite direction, from the
      top downward.
takes:
  - kind: apply
    what: an ordering given earlier, to be shown in one case
leaves:
  - kind: apply
    what: a descending sequence of requirements, to be put to work
    segment: 3
