id: name_the_consequence_then_define_the_name
description: >-
  Names the kind of case a previously stated rule tends to produce, then defines
  that name in the next sentence, so the reader leaves with a label they can
  actually use.
before:
  knowledge: >-
    holds one transferred rule together with the reason that makes it hold
  question: >-
    wants to know what follows when the balance of conditions runs the other way
  expectation: expects the opposite case to be taken up next in the same shape
  trust: >-
    raised a little, since the stated rule came with a reason rather than bare
after:
  knowledge: >-
    also holds a named kind of case that such conditions tend to produce,
    together with what the name means
  question: >-
    wants to know how the newly named kind of case comes about in practice
  expectation: >-
    expects the named kind of case to be worked out before any other case is
    taken up
  trust: >-
    raised further, since a term is explained as soon as it is used rather than
    left to stand
breaks:
  - >-
    name the case and move on without the second sentence — the reader carries a
    term they cannot unpack and everything built on it later rides on a guess
  - >-
    put the definition first and the named case after — the definition arrives
    before there is any situation to attach it to, and reads as vocabulary drill
  - >-
    describe the mechanism without giving it a name — the reader has the idea
    but no handle for it, and later paragraphs have to rebuild the whole
    description each time
  - >-
    expand the definition with two or three instances — the paragraph stops
    being a short hinge, and the reader loses the thread back to the rule it
    rests on
  - >-
    hedge the first sentence into a possibility rather than a tendency — the
    reader no longer sees the case as what the conditions normally produce, so
    the name looks like one option among many
segments:
  - operation: >-
      names the characteristic form a situation of this kind tends to take, and
      attaches a term to it
  - operation: >-
      gives a plain-language definition of a term, stating what it consists in
    relation: >-
      it unpacks the term the sentence before it introduced and left unexplained
