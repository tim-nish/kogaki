id: pose_a_question_and_grant_its_ready_answers
description: >-
  Puts a plain question to the reader, concedes that many answers are already
  available, then runs through them to the most abstract, settling on none.
breaks:
  - >-
    cut the opening question and begin from the answers — the reader is handed
    replies to a question they were never given, and holds no gap for them to
    fill
  - >-
    drop the admission that answers are many and name only one — the reader's
    own ready explanations go unacknowledged, and the step reads as dismissal
  - >-
    replace the run of instances with one illustrative case — the range the
    admission claimed is never shown, and that claim stays an assertion
  - >-
    argue against each instance as it is listed — the concession stops being a
    concession, and the goodwill of granting the reader's own view is lost
  - >-
    add a paragraph defining the matter before the question is asked — the first
    specialist demand arrives before the reader has any stake, and the text
    reads as a textbook
segments:
  - operation: poses a question about why a condition persists
    manner: a single unframed question that takes no lead-in and no elaboration
  - operation: grants that the question admits many answers
    relation: >-
      replies to the step before it not with an answer but with the admission
      that answers are many
  - operation: >-
      lists instances of what was granted in one run and carries the series out
      to its most abstract end
    relation: >-
      fills the general admission of the step before it with instances, widening
      as it goes
takes: []
leaves:
  - kind: answer
    what: a question about why a condition persists, left standing
    segment: 1
  - kind: apply
    what: a most abstract general statement reached at a series' end
    segment: 3
