id: date_what_arose_from_the_period_by_its_founding_instances
description: >-
  Names what came into being under the conditions just traced, then fixes its
  two founding instances in time and gives each the danger it arose to avert.
before:
  knowledge: >-
    holds that a like configuration arose in the earlier case, how it was held
    steady, and what began to break it
  question: >-
    wants to know whether the course the earlier case ran is the one now being
    run again
  expectation: >-
    expects the account to come back to the present case and carry the earlier
    course onto it, that earlier course now run through to its turn
  trust: >-
    slightly raised by bounded, checkable specifics offered for the earlier case
after:
  knowledge: >-
    holds that the thing itself originated in those conditions, fixed by founding
    instances placed in time and the danger each addressed
  question: >-
    wants to know what the remedies those founding instances urged would mean
    for the case at hand
  expectation: >-
    having had the origin placed and motivated, expects the account to turn that
    origin onto the case at hand and say what the same thing is for now
  trust: >-
    further raised by named founding instances given with their placing in time
    and their stated purposes
breaks:
  - >-
    name the founding instances without placing them in time — the origin claim
    loses the checkable footing that carries the weight of the parallel
  - >-
    leave out what each founding instance arose to avert — the pair becomes a
    list and the tie back to the conditions just traced is cut
  - >-
    place the founding instances before naming what arose from the conditions —
    the reader meets particulars with nothing yet to attach them to
  - >-
    expound each founding instance in its own paragraph — the thread back to the
    case at hand is buried before it can be picked up
segments:
  - operation: names what came into being under a given set of conditions
  - operation: >-
      fixes the earliest founding instance of that thing at a precise point in
      time
    relation: >-
      turns the bare claim of emergence into the first concrete marker that
      places it
    manner: >-
      a clipped statement closing on the marker itself, with no elaboration
  - operation: >-
      fixes a further founding instance of the same kind in time and assigns to
      each member of the resulting pair the danger it arose to avert
    relation: >-
      repeats the placing of the step before and then closes both into one set
      by giving each its purpose
