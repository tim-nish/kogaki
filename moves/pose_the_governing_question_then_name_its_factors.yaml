id: pose_the_governing_question_then_name_its_factors
description: >-
  Asks what governs the variation just granted, says the answer comes in a
  counted few parts, then names them bare, leaving the reader holding a frame
  rather than an explanation.
before:
  knowledge: >-
    holds that the principle operates only under some conditions, and that those
    conditions sort instances unevenly
  question: >-
    wants to know what decides which side a given instance falls on, and why the
    strongest one is the exception
  expectation: >-
    expects the conditions behind the division to be set out next, the division
    and its stake now given
after:
  knowledge: >-
    holds names for the parts that decide the variation, as labels not yet
    explained
  question: >-
    wants to know what each named part means and how it decides the variation
  expectation: >-
    expects each named part to be taken up in turn, the governing question now
    answered by bare naming alone
breaks:
  - >-
    drop the opening question and announce the parts directly — the labels
    arrive with no hole to fill, and the reader receives a list they never asked
    for
  - >-
    merge the count and the names into one sentence — the brief pause that lets
    the reader brace for a closed set is gone, and the labels land as
    undifferentiated detail
  - >-
    gloss each part where it is first named — the paragraph stops being a frame
    and becomes the explanation, so the reader loses the short list they could
    carry forward whole
  - >-
    add a further part beyond those the count announced — what arrives no longer
    matches what was promised a sentence earlier, and the frame stops being
    something the reader can trust
  - >-
    replace the direct question with a statement that the matter has determining
    factors — the reader is told what is coming instead of asking for it, and
    the answer loses the pull of being requested
segments:
  - operation: >-
      poses, as a direct question, what decides the degree of variation in an
      established pattern
  - operation: >-
      states that the determining factors are a counted number of parts,
      delivered at once
    relation: >-
      it frames the answer the question just posed calls for, without yet
      supplying its content
  - operation: names each part of the announced set in turn
    relation: >-
      it fills the set the previous step promised with its members, closing the
      question with labels only
    manner: a bare naming to which no gloss or elaboration is attached
obligation:
  - each of the counted parts, in the order named
