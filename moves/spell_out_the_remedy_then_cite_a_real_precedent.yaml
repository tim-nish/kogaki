id: spell_out_the_remedy_then_cite_a_real_precedent
description: >-
  Turns an abstract remedy into a working mechanism in one sentence, then
  grounds it in a real historical proposal so the reader takes the idea
  seriously.
before:
  knowledge: >-
    also holds what single arrangement would close that gap, and what such an
    arrangement would amount to
  expectation: >-
    expects the next step to test whether the arrangement just named is
    achievable
  trust: >-
    raised again: the objection the reader could have made is granted before the
    claim is pressed
after:
  knowledge: >-
    also holds how that arrangement would work in practice and that it has been
    proposed in earnest before
  expectation: >-
    expects to learn what became of the earlier proposal, and so whether the
    arrangement is attainable
  trust: >-
    raised further: the idea is shown to have been advanced in earnest by a
    figure of standing
breaks:
  - >-
    drop the precedent and keep only the hypothetical — the arrangement stays a
    thought experiment and the reader quietly discounts it
  - >-
    expand the mechanism into a paragraph of institutional detail — the brevity
    that made it read as a plain consequence goes, and it reads as the writer's
    own scheme
  - >-
    put the precedent first and the mechanism after it — the reader is asked to
    credit a figure's judgment before knowing what was proposed
  - >-
    add a hedge conceding the arrangement is unrealistic — the test the reader
    was waiting for is pre-empted and the open question loses its pull
segments:
  - operation: >-
      sets out in concrete terms what a proposed arrangement would make possible
      once it were in place
  - operation: >-
      names an actual instance in which the same proposal was advanced before
    relation: >-
      it grounds the hypothetical just set out by showing the idea has been put
      forward in earnest
    manner: >-
      a single brief statement resting on a named figure, offered with no
      elaboration
