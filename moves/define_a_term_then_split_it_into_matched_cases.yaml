id: define_a_term_then_split_it_into_matched_cases
description: >-
  Names an unfamiliar term, gives its sense in one sentence, then splits it into
  two matched cases, so the reader can use the word before anything is built on
  it.
before:
  knowledge: >-
    no specialist vocabulary for the subject; at most an everyday impression of
    it
  question: >-
    nothing specific; at most whether this will be readable without background
  expectation: that an unfamiliar subject will be explained from the beginning
  trust: neutral; willing to read on
after:
  knowledge: holds one named measure and the two cases it divides into
  question: what decides which of the two cases holds, and what follows from it
  expectation: >-
    that what follows will put the two cases to work rather than define further
  trust: >-
    raised: the writer settles a term's meaning before building anything on it
breaks:
  - >-
    Drop the opening gloss and begin from the two cases — the reader meets a
    pair of conditions with nothing they are conditions of, and has to
    reverse-engineer the term.
  - >-
    Give only the first case and leave the second as its implied opposite — the
    reader cannot tell whether the two exhaust the possibilities, and the term
    stays one-sided.
  - >-
    Insert a paragraph of illustration between the gloss and the two cases — the
    examples arrive before the test that sorts them, and the reader stores them
    without being able to place them.
  - >-
    Reword the second case freely instead of matching the first — the reader
    loses the single axis the two share and must compare two differently built
    claims.
segments:
  - operation: >-
      introduces an unfamiliar label and gives its sense in a single sentence.
  - operation: announces that definitions follow.
    relation: >-
      takes the two alternatives the opening sentence put side by side and
      promises each its own definition.
    manner: a bare announcement, carrying no reason and no appraisal.
  - operation: >-
      gives the first of two cases its defining condition in one clause.
    relation: >-
      delivers the first of the definitions the sentence before it promised.
  - operation: gives the remaining case its defining condition in one clause.
    relation: >-
      completes the pair, standing opposite the case before it and turning on
      the same test.
    manner: >-
      a matched pair of short conditions, worded alike except where they must
      differ.
