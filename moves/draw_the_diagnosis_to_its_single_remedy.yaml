id: draw_the_diagnosis_to_its_single_remedy
description: >-
  Draws the preceding diagnosis to its endpoint by naming the one arrangement
  that would remove the cause, then restates that arrangement under a name
  showing its scale.
before:
  knowledge: >-
    holds that a formal rule can exist with nothing able to apply it, and that
    the gap invites the conduct the rule forbids
  question: >-
    has that consequence and now wants to know whether such a gap can be closed
    at all
  expectation: >-
    expects the next step to move from the consequence just drawn to whether
    anything could close the gap
after:
  knowledge: >-
    also holds what single arrangement would close that gap, and what such an
    arrangement would amount to
  question: >-
    has an answer in principle and now wants to know whether that arrangement
    could ever be brought about
  expectation: >-
    expects the next step to test whether the arrangement just named is
    achievable
breaks:
  - >-
    drop the second formulation and stop at the first — the remedy stays an
    abstract arrangement and the reader never feels how large a thing has just
    been proposed
  - >-
    add the objections to the remedy inside this step — the endpoint loses its
    force as an endpoint and the question the reader would have asked never
    forms
  - >-
    soften the remedy into one of several possible measures — the step stops
    being the conclusion the preceding reasoning pointed to, and there is
    nothing definite for the reader to react against
  - >-
    put the renaming first and derive the arrangement from it — the name arrives
    before the reasoning that makes the arrangement inevitable, and reads as a
    topic rather than a conclusion
  - >-
    spell out how the arrangement would be built — the step grows into a
    programme, and the clean implication of the earlier account is buried
segments:
  - operation: >-
      names the one arrangement that would remove the cause entirely, given as
      the ultimate remedy
  - operation: >-
      restates the same remedy in other words, naming the thing it would be
    relation: >-
      gives the proposal of the step before it a second formulation under a name
