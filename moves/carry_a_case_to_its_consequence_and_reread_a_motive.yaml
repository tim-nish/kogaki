id: carry_a_case_to_its_consequence_and_reread_a_motive
description: >-
  Carries an accepted classification one step to its practical consequence,
  restates it in its sharpest form, and uses it to re-describe a motive the
  reader would have read the other way.
before:
  knowledge: >-
    also holds one worked instance assigned to one of the cases together with
    the ground for the assignment
  question: >-
    answered for one instance; now what the contrasting instance of the
    announced pair yields
  expectation: >-
    that the other instance of the announced pair will be worked through the
    same way
after:
  knowledge: >-
    now also holds the practical consequence that the assignment entails, and a
    familiar motive restated in the framework's terms
  question: >-
    still the contrasting instance, and now also whether a consequence of the
    same shape can be drawn there
  expectation: >-
    that the contrasting instance comes next, one case having now been carried
    from its assignment to a consequence about motive
breaks:
  - >-
    cut the middle restatement — the reader reaches the re-described motive
    without the consequence in its sharpest form, and the last sentence reads as
    a leap
  - >-
    drop the opening consequential connective and state the conclusion flat —
    the reader stops seeing it as following from a case they already granted,
    and it reads as the author's opinion
  - >-
    state the closing sentence as the plain purpose, without setting it against
    the reading the reader brought — the prior reading survives untouched and
    the framework is shown doing nothing
  - >-
    insert a paragraph of figures about the instance before the conclusion — the
    chain from assignment to motive is broken and the reader loses the thread
    the reversal depends on
segments:
  - operation: >-
      draws out what a classification implies for how one would best act under
      it
  - operation: >-
      compresses a stated consequence into one sentence that holds two opposed
      notions together
    relation: >-
      it keeps the content of the step before it and only tightens the wording,
      so the paradox in it becomes audible
  - operation: >-
      redescribes a motive the audience would read one way as the same act
      performed for the end the compressed consequence names
    relation: >-
      it applies the tightened consequence to a concrete motive, turning the
      general statement into a verdict about why people act
    manner: >-
      two near-identical wordings set side by side, the second differing only by
      its closing clause
