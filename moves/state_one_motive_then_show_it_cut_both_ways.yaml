id: state_one_motive_then_show_it_cut_both_ways
description: >-
  States one disposition as universal, uses it to take a suspected declaration
  at face value, then shows that disposition at work on both sides of a single
  present-day pairing.
before:
  knowledge: >-
    no specialized knowledge of the subject and no framework for reading it
  question: nothing in particular open beyond whether this will be followable
  expectation: expects a plain explanation an outsider can follow
  orientation: >-
    places this vaguely among general-interest explanations of current affairs
  trust: neutral, willing to listen but not yet committed
after:
  knowledge: >-
    holds one general principle about a class of actors and one present case in
    which it operates
  question: >-
    wants to know what results when each of two sides acts from the same
    protective motive
  expectation: >-
    expects what comes next to draw the consequence out of the case just laid
    out
  orientation: >-
    places this against the common cynical reading of the motives at issue
  trust: >-
    raised: a commonplace is taken at face value and then carried into a case
    the reader can check
breaks:
  - >-
    Soften the opening claim into a mere tendency rather than the sole concern —
    the correction that follows has nothing firm to push against, and the case
    reads as ordinary commentary
  - >-
    Cut the explained commonplace and run straight from the principle to the
    present case — the reader keeps the suspicion that such declarations are
    pretexts, and the case demonstrates nothing
  - >-
    Swap the one contemporary pairing for two or three instances from the
    distant past — the reader loses the case they can check against what they
    already hear about, and the principle stays abstract
  - >-
    Give only one side's motive at the close and leave the other's reaction
    implied — the pairing stops being a pairing, and the mechanism the paragraph
    exists to show never closes
  - >-
    Add a definition of the governing concept ahead of the opening claim — the
    first thing the reader meets needs expertise, and the plain way in is gone
segments:
  - operation: >-
      asserts, as a general principle, that every member of a class is concerned
      with one thing only
  - operation: >-
      explains a routinely made public declaration as sincere rather than as a
      cover for something else
    relation: >-
      draws its explanation straight out of the principle just asserted,
      applying it exactly where the opposite reading would be expected
    manner: a short quoted declaration put in the mouth of a typical actor
  - operation: >-
      states a reaction shared by all members of the class when a close
      counterpart rapidly grows stronger
    relation: >-
      turns from how an actor regards itself to how it is regarded by those
      beside it
  - operation: >-
      designates one present-day pairing as the typical instance of the
      regularity in play
    relation: >-
      narrows the general reaction just stated to a single concrete pairing
  - operation: >-
      sets the two sides of one pairing against each other, each acting from the
      same self-protective motive to opposite effect
    relation: unpacks the pairing just named by giving what each side does
    manner: a brief quoted apprehension attributed to one side
