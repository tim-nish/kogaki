# The mechanical gate half (specs/SPEC.md §4): runs unconditionally in CI.
# Discovery is registry-driven — the suite runs only checks registered in
# checks/registry.json; an enumerated check list here would be the shape the
# registry exists to prevent (kogaki#6, story 1.2).
name: checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  registered-checks:
    name: Run every registered check (registry-driven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `pull-requests: read` was granted for check-review-report.sh's comment
      # read and went with it (kogaki#630, swept at kogaki#632). No registered
      # check reads a PR any more.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run registered checks
        env:
          # Supplied for checks that read the branch's own git-resident text
          # (e.g. consult-receipts). Empty on push events, where the head
          # commit is the whole range.
          CONSULT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONSULT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONSULT_PR_BODY: ${{ github.event.pull_request.body }}
          # REMOVED (kogaki#632). This block wrote `GH_TOKEN`,
          # `REVIEW_PR_NUMBER` and `REVIEW_HEAD_SHA` for `check-review-report.sh`
          # under the rule that a writer belongs beside its reader (kogaki#36).
          # kogaki#630 deleted that reader with the rest of the parallel
          # reviewer stack, and the three names have no other consumer in the
          # tree — so the writer stood beside nothing, which is the false
          # record #630 corrected everywhere it could see.
          #
          # It is the one the retirement's sweep could not see, and the reason
          # is worth keeping: it names `review-report` WITHOUT the `check-`
          # prefix every other pointer in that sweep carried, so no widening of
          # that grep would have reached it. #632's remedy derives the residue
          # set from the deleted artifacts' reference graph instead.
        run: |
          python3 - <<'EOF'
          import json, pathlib, subprocess, sys
          registry = json.loads(pathlib.Path("checks/registry.json").read_text())
          entries = registry["checks"]
          if not entries:
              print("ok: no registered checks (registry empty)")
              sys.exit(0)
          failed = []
          for entry in entries:
              path = pathlib.Path("checks") / entry["file"]
              print(f"== {entry['id']} ({path})", flush=True)
              result = subprocess.run(["bash", str(path)])
              # The catch ledger's primary capture (kogaki#113): one line per
              # check per exercised run, in the run log — assembled on demand,
              # never a stored second ledger (owner decision 2026-08-06). A
              # "fail" is a catch: the check found what it guards against.
              # Disclosed limit: Actions log retention bounds the window any
              # retention judgment can count over. Flushed per line: the run
              # log is the primary and only capture, so a cancelled job must
              # not lose the catches already made (PR #114 review, finding 3).
              print(f"catch: {entry['id']} outcome="
                    f"{'pass' if result.returncode == 0 else 'fail'}",
                    flush=True)
              if result.returncode != 0:
                  failed.append(entry["id"])
          if failed:
              print(f"FAIL: {', '.join(failed)}")
              sys.exit(1)
          print(f"ok: {len(entries)} registered check(s) ran; gate checked: "
                "registry-driven discovery, per-check pass")
          EOF

  license-assertion:
    name: Change licensed by a named issue (deny-never-warn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert a licensing issue is named
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            haystack="$PR_TITLE
          $PR_BODY
          $(git log --format='%s %b' "$PR_BASE".."$PR_HEAD")"
          else
            haystack="$(git log -1 --format='%s %b' HEAD)"
          fi
          if printf '%s' "$haystack" | grep -qE '#[0-9]+'; then
            printf 'ok: licensing issue named — gate checked: #N present in %s\n' \
              "$([ "$EVENT_NAME" = "pull_request" ] && echo 'PR title/body/commits' || echo 'the pushed head commit')"
          else
            echo "FAIL: no licensing issue named (#N) in title, body, or commits."
            echo "A change without a license is refused — deny, never warn; the"
            echo "work re-routes to an issue (specs/SPEC.md §4, responsibility clause)."
            exit 1
          fi
