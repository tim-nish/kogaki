# Re-fires the checks run when a review-lane report lands (kogaki#47).
#
# The presence gate (check-review-report) fetches PR comments LIVE at
# execution, but a comment does not retrigger the pull_request workflow —
# so without this, every PR sits red-with-report until a human reruns the
# job (observed on PR #49). This closes that gap mechanically rather than
# as a prompted duty of the reviewer session: prompted properties fail
# invisibly, and the output looks identical whether they held or not.
#
# Scope: fires only on comments whose body opens with the report token, on
# PRs, and only reruns a COMPLETED, FAILED checks run for the PR's current
# head. A run in progress will fetch the comment itself; a green run needs
# nothing; no matching run is reported, not invented.
name: review-recheck
on:
  issue_comment:
    types: [created]

jobs:
  refire:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, 'review-lane report:') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun the failed checks run for this PR's head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          run="$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request" \
                 --jq '[.workflow_runs[] | select(.path==".github/workflows/checks.yml")][0]')"
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "no checks run found for head $head — nothing to re-fire (the PR run may not have started yet)"
            exit 0
          fi
          id="$(echo "$run" | jq -r .id)"
          status="$(echo "$run" | jq -r .status)"
          conclusion="$(echo "$run" | jq -r .conclusion)"
          if [ "$status" != "completed" ]; then
            echo "checks run $id is $status — it fetches comments live and will see this report; nothing to re-fire"
            exit 0
          fi
          if [ "$conclusion" = "success" ]; then
            echo "checks run $id already green — nothing to re-fire"
            exit 0
          fi
          echo "re-firing failed jobs of checks run $id (head $head) — a landed report leaves the PR green without human touch (kogaki#47)"
          gh api -X POST "repos/$REPO/actions/runs/$id/rerun-failed-jobs"
