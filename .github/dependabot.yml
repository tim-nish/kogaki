# Grouped monthly npm updates, merged through the ordinary route
# (specs/SPEC.md, "The npm advisories", kogaki#1795).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Follows the Node major the checks workflow installs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Waits for an Issue that re-derives tsc-baseline.json.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
